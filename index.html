<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador y Reemplazador</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <h1>Buscador y Reemplazador de Palabras</h1>

    <textarea id="texto" placeholder="Escribe o pega aquí tu texto..."></textarea>

    <div class="inputs">
      <input id="busqueda" type="text" placeholder="Palabras a buscar (separadas por comas)">
      <input id="reemplazo" type="text" placeholder="Nueva palabra (para reemplazar)">
    </div>

    <div class="buttons">
      <button id="btnBuscar">Buscar</button>
      <button id="btnReemplazar">Reemplazar</button>
    </div>

    <p id="resultado"></p>
    <div id="textoResaltado"></div>
  </div>

  <script src="./bundle.js"></script>
</body>
</html>
